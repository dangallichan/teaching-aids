<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Generator</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: Canvas; color: CanvasText; padding: 1rem;
  }
  main { width: 100%; max-width: 480px; }
  h1 { font-size: 1.4rem; margin: 0 0 1rem; }
  .out { display: flex; gap: .5rem; }
  #pw {
    flex: 1; min-width: 0; font: 1.1rem ui-monospace, Menlo, Consolas, monospace;
    padding: .7rem; border: 1px solid #888; border-radius: 6px;
    background: transparent; color: inherit;
  }
  button {
    font: inherit; padding: .6rem 1rem; border-radius: 6px; cursor: pointer;
    border: 1px solid #888; background: transparent; color: inherit;
  }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button:hover { filter: brightness(1.1); }
  .row { display: flex; align-items: center; gap: .75rem; margin: 1rem 0 .5rem; }
  .row input[type=range] { flex: 1; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem 1rem; margin-bottom: 1rem; }
  label { cursor: pointer; }
  .opt { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
  .min { font-size: .85rem; opacity: .85; white-space: nowrap; }
  .min input {
    width: 3.6rem; padding: .25rem; border: 1px solid #888; border-radius: 4px;
    background: transparent; color: inherit; font: inherit;
  }
  .ambig { display: block; margin-bottom: 1rem; }
  #meter { height: 6px; border-radius: 3px; background: #8884; overflow: hidden; margin-top: .6rem; }
  #bar { height: 100%; width: 0; transition: width .2s, background .2s; }
  #info { font-size: .85rem; opacity: .75; margin-top: .3rem; min-height: 1.2em; }
  .actions { display: flex; gap: .5rem; margin-top: 1rem; }
  .actions .primary { flex: 1; }
  footer { font-size: .8rem; opacity: .6; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>Password Generator</h1>

  <div class="out">
    <input id="pw" type="text" readonly aria-label="Generated password">
    <button id="copy" type="button">Copy</button>
  </div>
  <div id="meter"><div id="bar"></div></div>
  <div id="info"></div>

  <div class="row">
    <label for="len">Length: <strong id="lenVal">20</strong></label>
    <input id="len" type="range" min="8" max="64" value="20">
  </div>

  <div class="opts">
    <div class="opt"><label><input type="checkbox" id="lower" checked> a–z</label>
      <span class="min">min <input type="number" id="min-lower" min="0" max="64" value="1"></span></div>
    <div class="opt"><label><input type="checkbox" id="upper" checked> A–Z</label>
      <span class="min">min <input type="number" id="min-upper" min="0" max="64" value="1"></span></div>
    <div class="opt"><label><input type="checkbox" id="digits" checked> 0–9</label>
      <span class="min">min <input type="number" id="min-digits" min="0" max="64" value="1"></span></div>
    <div class="opt"><label><input type="checkbox" id="symbols" checked> Symbols</label>
      <span class="min">min <input type="number" id="min-symbols" min="0" max="64" value="1"></span></div>
  </div>
  <label class="ambig"><input type="checkbox" id="ambig"> Avoid look-alikes (O/0, l/1/I)</label>

  <div class="actions">
    <button id="gen" class="primary" type="button">Generate new</button>
  </div>

  <footer>Runs entirely in your browser using the Web Crypto API. Nothing is sent or stored anywhere.</footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SETS = {
    lower:   "abcdefghijklmnopqrstuvwxyz",
    upper:   "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    digits:  "0123456789",
    symbols: "!@#$%^&*()-_=+[]{};:,.?/~"
  };
  const AMBIGUOUS = /[O0oIl1|]/g;

  // Unbiased random integer in [0, max) via rejection sampling
  function randInt(max) {
    const limit = Math.floor(0x100000000 / max) * max;
    const buf = new Uint32Array(1);
    do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
    return buf[0] % max;
  }

  // Returns [{chars, min}] for each ticked category
  function pools() {
    const out = [];
    for (const k of Object.keys(SETS)) {
      if ($(k).checked) {
        let s = SETS[k];
        if ($("ambig").checked) s = s.replace(AMBIGUOUS, "");
        const min = Math.max(0, Math.min(64, parseInt($("min-" + k).value, 10) || 0));
        if (s) out.push({ chars: s, min });
      }
    }
    return out;
  }

  function generate() {
    let len = +$("len").value;
    const ps = pools();
    if (!ps.length) { $("pw").value = ""; $("info").textContent = "Select at least one character type."; setBar(0); return; }
    const totalMin = ps.reduce((a, p) => a + p.min, 0);
    if (totalMin > 64) { $("pw").value = ""; $("info").textContent = "Minimums add up to more than 64 characters."; setBar(0); return; }
    if (totalMin > len) { len = totalMin; $("len").value = len; $("lenVal").textContent = len; } // lengthen to fit minimums
    const all = ps.map(p => p.chars).join("");
    const chars = [];
    for (const p of ps) for (let i = 0; i < p.min; i++) chars.push(p.chars[randInt(p.chars.length)]);
    while (chars.length < len) chars.push(all[randInt(all.length)]);
    for (let i = chars.length - 1; i > 0; i--) { // Fisher–Yates shuffle
      const j = randInt(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    $("pw").value = chars.join("");
    const bits = Math.round(len * Math.log2(all.length));
    $("info").textContent = `~${bits} bits of entropy`;
    setBar(bits);
  }

  function setBar(bits) {
    const pct = Math.min(100, bits / 128 * 100);
    $("bar").style.width = pct + "%";
    $("bar").style.background = bits < 60 ? "#dc2626" : bits < 80 ? "#f59e0b" : "#16a34a";
  }

  async function copy() {
    const v = $("pw").value;
    if (!v) return;
    try { await navigator.clipboard.writeText(v); }
    catch { $("pw").select(); document.execCommand("copy"); }
    $("copy").textContent = "Copied!";
    setTimeout(() => $("copy").textContent = "Copy", 1200);
  }

  $("len").addEventListener("input", () => { $("lenVal").textContent = $("len").value; generate(); });
  for (const k of ["lower","upper","digits","symbols","ambig"]) $(k).addEventListener("change", generate);
  for (const k of ["lower","upper","digits","symbols"]) $("min-" + k).addEventListener("input", generate);
  $("gen").addEventListener("click", generate);
  $("copy").addEventListener("click", copy);
  generate();
})();
</script>
</body>
</html>
