<!DOCTYPE html>
<!-- code generated for D. Gallichan by Claude, date: 16/10/26 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetisation and signal</title>
<!-- Inter from Google Fonts; falls back to the system UI font if offline -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 16px;
    background: #fff;
    color: #222;
  }
  #app { max-width: 920px; margin: 0 auto; }
  #title { text-align: center; font-size: 15px; margin: 4px 0 8px; line-height: 1.5; }
  #title .k { color: #7a7f87; font-weight: 500; }
  #title b { font-weight: 600; }
  canvas { width: 100%; display: block; }
  .controls {
    margin-top: 14px; padding: 14px 22px 8px; background: #f8f8fa; border-radius: 10px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 28px;
  }
  @media (max-width: 760px) { .controls { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .controls { grid-template-columns: 1fr; } }
  .ctl .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ctl label { font-size: 14px; font-weight: 700; color: #222; }
  .ctl:focus-within label, .ctl:active label { color: #1a6fd1; }
  .ctl output { font-size: 16px; color: #1a6fd1; font-variant-numeric: tabular-nums; }

  /* Slider: thick rounded track, blue fill, round thumb with a halo while in use */
  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 30px;
    margin: 4px 0 0; background: transparent; cursor: pointer; --p: 50%;
  }
  input[type=range]:focus { outline: none; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, #1a73e8 var(--p), #d6e0f3 var(--p));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin-top: -5px;
    border-radius: 50%; background: #1a73e8; border: 0; box-shadow: 0 0 0 0 rgba(26,115,232,0);
    transition: box-shadow .12s;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb,
  input[type=range]:active::-webkit-slider-thumb { box-shadow: 0 0 0 6px rgba(26,115,232,0.22); }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: #d6e0f3; }
  input[type=range]::-moz-range-progress { height: 8px; border-radius: 4px; background: #1a73e8; }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px; border: 0; border-radius: 50%; background: #1a73e8;
    box-shadow: 0 0 0 0 rgba(26,115,232,0); transition: box-shadow .12s;
  }
  input[type=range]:focus-visible::-moz-range-thumb,
  input[type=range]:active::-moz-range-thumb { box-shadow: 0 0 0 6px rgba(26,115,232,0.22); }
</style>
</head>
<body>
<div id="app">
  <div id="title"></div>
  <canvas id="plot"></canvas>
  <div class="controls">
    <div class="ctl"><div class="head"><label for="T1">T1 (s)</label><output id="T1o"></output></div>
      <input type="range" id="T1" min="0.1" max="5" step="0.05" value="0.9"></div>
    <div class="ctl"><div class="head"><label for="TRexp">TR (s), log scale</label><output id="TRo"></output></div>
      <input type="range" id="TRexp" min="-6" max="2.2" step="0.02" value="-1"></div>
    <div class="ctl"><div class="head"><label for="flip">Flip angle (&deg;)</label><output id="flipo"></output></div>
      <input type="range" id="flip" min="1" max="90" step="1" value="90"></div>
    <div class="ctl"><div class="head"><label for="tMax">tMax (s)</label><output id="tMaxo"></output></div>
      <input type="range" id="tMax" min="1" max="15" step="0.5" value="10"></div>
  </div>
</div>

<script>
// code generated for D. Gallichan by Claude, date: 16/10/26

const N = 5000;
const FONT = '"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';

// Equivalent of Python's f"{x:g}" / f"{x:.3g}": significant figures, trailing zeros dropped
function fmtG(x, sig) {
  if (!isFinite(x)) return "nan";
  return String(Number(x.toPrecision(sig)));
}

function simulate(T1, TR, flipDeg, tMax) {
  const dt = tMax / (N - 1);
  const cosFlip = Math.cos(flipDeg * Math.PI / 180);
  const sinFlip = Math.sin(flipDeg * Math.PI / 180);

  // Indices of samples nearest each RF pulse time (TR, 2TR, ... < tMax)
  const isFlip = new Uint8Array(N);
  const iFlips = [];
  for (let k = 1; k * TR < tMax; k++) {
    const i = Math.round(k * TR / dt);
    if (i > 0 && i < N) { isFlip[i] = 1; iFlips.push(i); }
  }

  const M = new Float64Array(N);
  M[0] = 1;
  for (let i = 1; i < N; i++) {
    M[i] = M[i - 1] + ((1 - M[i - 1]) / T1) * dt;
    if (isFlip[i]) M[i] *= cosFlip;
  }

  // Signal: magnetisation just before each flip, times sin(flip)
  const signal = iFlips.map(i => M[i - 1] * sinFlip);
  return { dt, M, iFlips, signal };
}

function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
}
function ticks(lo, hi, target) {
  const step = niceStep((hi - lo) / target);
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) {
    out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  }
  return out;
}

const canvas = document.getElementById("plot");
const ctx = canvas.getContext("2d");

function updateFills() {
  for (const el of document.querySelectorAll("input[type=range]")) {
    const lo = parseFloat(el.min), hi = parseFloat(el.max);
    el.style.setProperty("--p", ((parseFloat(el.value) - lo) / (hi - lo) * 100) + "%");
  }
}

function draw() {
  updateFills();
  const T1 = parseFloat(document.getElementById("T1").value);
  const TR = Math.pow(2, parseFloat(document.getElementById("TRexp").value));
  const flip = parseFloat(document.getElementById("flip").value);
  const tMax = parseFloat(document.getElementById("tMax").value);

  document.getElementById("T1o").textContent = fmtG(T1, 3);
  document.getElementById("TRo").textContent = fmtG(TR, 3);
  document.getElementById("flipo").textContent = fmtG(flip, 3);
  document.getElementById("tMaxo").textContent = fmtG(tMax, 3);

  const { dt, M, iFlips, signal } = simulate(T1, TR, flip, tMax);

  let Mmin = Infinity;
  for (let i = 0; i < N; i++) if (M[i] < Mmin) Mmin = M[i];
  const yMin = Math.min(Mmin, 0), yMax = 1.05;
  const xMin = 0, xMax = 1.05 * tMax;

  const last = signal.length ? signal[signal.length - 1] : NaN;
  document.getElementById("title").innerHTML =
    `<span class="k">Tissue:</span> T1 = <b>${fmtG(T1, 3)}s</b> &nbsp;&nbsp; ` +
    `<span class="k">Scan:</span> TR = <b>${fmtG(TR, 3)}s</b>, Flip Angle = <b>${fmtG(flip, 3)}&deg;</b> &nbsp;&nbsp; ` +
    `<span class="k">Resulting signal:</span> <b>${fmtG(last, 3)}</b>`;

  // HiDPI canvas sizing
  const cssW = canvas.clientWidth || 800;
  const cssH = Math.round(cssW * 0.52);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.height = cssH + "px";
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const mL = 55, mR = 14, mT = 40, mB = 48;   // top margin holds the legend strip
  const pw = cssW - mL - mR, ph = cssH - mT - mB;
  const X = x => mL + (x - xMin) / (xMax - xMin) * pw;
  const Y = y => mT + (1 - (y - yMin) / (yMax - yMin)) * ph;

  // Grid + ticks
  ctx.font = `400 12.5px ${FONT}`;
  ctx.fillStyle = "#6b7078";     // muted tick labels
  ctx.strokeStyle = "#ececef";   // pale grid
  ctx.lineWidth = 1;
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (const v of ticks(xMin, xMax, 8)) {
    const px = Math.round(X(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(px, mT); ctx.lineTo(px, mT + ph); ctx.stroke();
    ctx.fillText(fmtG(v, 6), px, mT + ph + 6);
  }
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  for (const v of ticks(yMin, yMax, 6)) {
    const py = Math.round(Y(v)) + 0.5;
    ctx.beginPath(); ctx.moveTo(mL, py); ctx.lineTo(mL + pw, py); ctx.stroke();
    ctx.fillText(fmtG(v, 6), mL - 6, py);
  }

  // Clip data to the axes
  ctx.save();
  ctx.beginPath(); ctx.rect(mL, mT, pw, ph); ctx.clip();

  // Signal bars (width limited so dense pulse trains don't fully overlap)
  const spacingPx = iFlips.length > 1 ? (X(iFlips[1] * dt) - X(iFlips[0] * dt)) : 8;
  ctx.strokeStyle = "#ff0000";
  ctx.lineWidth = Math.max(1, Math.min(8, spacingPx * 0.8));
  ctx.lineCap = "butt";
  ctx.beginPath();
  for (let k = 0; k < iFlips.length; k++) {
    const px = X(iFlips[k] * dt);
    ctx.moveTo(px, Y(0));
    ctx.lineTo(px, Y(signal[k]));
  }
  ctx.stroke();

  // Magnetisation curve
  ctx.strokeStyle = "#1f77b4";
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.beginPath();
  for (let i = 0; i < N; i++) {
    const px = X(i * dt), py = Y(M[i]);
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();

  // Light left and bottom spines only (no top/right box)
  ctx.strokeStyle = "#b9bdc4";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(mL + 0.5, mT);
  ctx.lineTo(mL + 0.5, mT + ph + 0.5);
  ctx.lineTo(mL + pw, mT + ph + 0.5);
  ctx.stroke();

  // Axis label
  ctx.fillStyle = "#4b5058";
  ctx.font = `500 13.5px ${FONT}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillText("Time (s)", mL + pw / 2, cssH - 8);

  // Legend: plain text strip above the axes, right-aligned, so it never hides data
  ctx.font = `400 13px ${FONT}`;
  const items = [["Magnetisation", "#1f77b4", 2.5], ["Signal", "#ff0000", 8]];
  const swatch = 24, gap = 8, between = 22;
  const widths = items.map(([name]) => swatch + gap + ctx.measureText(name).width);
  let lx = mL + pw - widths.reduce((a, b) => a + b, 0) - between * (items.length - 1);
  const cy = mT / 2 + 2;
  items.forEach(([name, col, w], q) => {
    ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = "butt";
    ctx.beginPath(); ctx.moveTo(lx, cy); ctx.lineTo(lx + swatch, cy); ctx.stroke();
    ctx.fillStyle = "#4b5058";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(name, lx + swatch + gap, cy);
    lx += widths[q] + between;
  });
}

for (const id of ["T1", "TRexp", "flip", "tMax"]) {
  document.getElementById(id).addEventListener("input", draw);
}
window.addEventListener("resize", draw);
draw();
// Canvas text uses whatever font is loaded at draw time, so redraw once Inter arrives
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load('400 13px "Inter"'),
    document.fonts.load('500 13px "Inter"'),
  ]).then(draw).catch(() => {});
}
</script>
</body>
</html>
